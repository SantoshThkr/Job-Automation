<!doctype html><html><head><meta charset="utf-8"><title>Lever apply (otp)</title></head><body><div class="application-page"><form id="application-form" action="/ats/lever/thanks.html" method="POST" enctype="multipart/form-data">
<h4>Submit your application</h4>
<ul>
<li class="application-question"><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><input type="file" id="resume-upload-input" name="resume"></div></li>
<li class="application-question"><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></li>
<li class="application-question"><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></li>
<li class="application-question"><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></li>
<li class="application-question"><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></li>
<li class="application-question"><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></li>
<li class="application-question"><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></li>
</ul>
<div class="application-additional"><ul><li class="application-question custom-question"><div class="application-label">How many years of experience do you have with TypeScript?<span class="required">✱</span></div>
<div class="application-field"><select name="cards[abc][field0]" required><option value="">Select...</option><option>0-1</option><option>2-3</option><option>4-5</option><option>6+</option></select></div></li></ul></div>
<div class="application-question"><div class="application-label">Additional information</div><textarea name="comments"></textarea></div>
<button id="btn-submit" class="template-btn-submit" type="submit" data-qa="btn-submit">Submit application</button>
</form></div>
<div id="hc" style="display:none"><p>We have sent a verification code to your email. Enter the 6-digit code.</p><input autocomplete="one-time-code" name="code"></div>
<script>document.getElementById('application-form').addEventListener('submit', e => { e.preventDefault(); document.getElementById('hc').style.display='block'; });</script></body></html>
