<!doctype html><html><head><meta charset="utf-8"><title>Job Application for UI Engineer - React at Gamma Health</title></head><body>
<div id="app_body">
  <div id="header"><h1 class="app-title">UI Engineer - React</h1><span class="company-name">at Gamma Health</span></div>
  <div id="content"><p>Build patient-facing web apps with React and TypeScript.</p></div>
  <a id="apply_button" class="button" href="#app">Apply for this job</a>
  <div id="application">
  <form id="application_form" action="/ats/greenhouse/confirmation.html" method="post" enctype="multipart/form-data">
    <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" required></div>
    <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" required></div>
    <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="text" id="email" name="job_application[email]" required></div>
    <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="job_application[phone]"></div>
    <div class="field" id="resume_fieldset"><label for="resume">Resume/CV <span class="asterisk">*</span></label><input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx"></div>
    <div id="custom_fields">
      <div class="field"><label for="q0">LinkedIn Profile <span class="asterisk">*</span></label><input type="text" id="q0" name="job_application[answers_attributes][0][text_value]" required></div>
      <div class="field"><label for="q1">Are you legally authorized to work in India? <span class="asterisk">*</span></label>
        <select id="q1" name="job_application[answers_attributes][1][boolean_value]" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
      <div class="field"><label for="q2">What is your notice period (in days)? <span class="asterisk">*</span></label><input type="text" id="q2" name="job_application[answers_attributes][2][text_value]" required></div>
      <div class="field"><label for="q3">Cover Letter</label><textarea id="q3" name="job_application[answers_attributes][3][text_value]"></textarea></div>
    </div>
    <div id="eeoc_fields"><div class="field"><label for="gender">Gender</label>
      <select id="gender" name="job_application[gender]"><option value="">Please select</option><option>Male</option><option>Female</option><option>Decline To Self Identify</option></select></div></div>
    <input type="submit" id="submit_app" value="Submit Application">
  </form></div>
</div></body></html>
