<!doctype html><html><head><meta charset="utf-8"><title>Greenhouse with required motivation</title></head><body>
<div id="app_body"><h1 class="app-title">Frontend Engineer</h1>
<form id="application_form" action="/ats/greenhouse/confirmation.html" method="post">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" required></div>
  <div class="field"><label for="resume">Resume *</label><input type="file" id="resume"></div>
  <div class="field"><label for="why">Why do you want to work at Gamma Health? *</label><textarea id="why" required></textarea></div>
  <input type="submit" id="submit_app" value="Submit Application">
</form></div></body></html>
