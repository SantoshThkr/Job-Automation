<!doctype html><html><head><meta charset="utf-8"><title>Careers - Flipcoin Lab</title>
<style>#success,#error{display:none}label.error{color:#c00;display:block}</style></head><body>
<!-- flipkoins.com (run #21): jQuery Validate makes the "Message" box required in script (no HTML attribute) and
     reports in <label class="error" for="message">; nothing is sent until the form is complete -->
<h1>Apply Now</h1>
<form id="careerForm" class="form-inline was-validated" method="post" action="mail-send.php">
 <input type="text" name="firstname" placeholder="First name*" required>
 <input type="text" name="lastname" placeholder="Last name*" required>
 <input type="email" name="email" placeholder="Email*" required>
 <input type="text" name="phone" placeholder="Phone*" required>
 <div class="col-lg-12"><textarea name="message" id="message" placeholder="Message"></textarea></div>
 <button type="submit" class="btn btn-primary" name="button">Apply</button>
</form>
<div id="success">Applied successfully!</div>
<div id="error">Opps! There is something wrong. Please try again</div>
<script>
  window.SUBMITS = 0;
  const form = document.getElementById('careerForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = form.elements.message, old = document.getElementById('message-error');
    if (old) old.remove();
    if (!msg.value.trim()) {
      msg.classList.add('error'); msg.setAttribute('aria-invalid', 'true');
      msg.insertAdjacentHTML('afterend', '<label id="message-error" class="error" for="message">um...yea, you have to write something to send this form.</label>');
      return;
    }
    msg.classList.remove('error'); msg.setAttribute('aria-invalid', 'false');
    window.SUBMITS++;
    await fetch('/submit-lab/api/apply?r=plain', { method: 'POST', body: new FormData(form) }).then(r => r.text());
    form.reset(); form.style.display = 'none';
    document.getElementById('success').style.display = 'block';
  });
</script></body></html>
