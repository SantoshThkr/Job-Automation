<!doctype html><html><head><meta charset="utf-8"><title>Sign in - Google Accounts</title></head><body>
<!-- Naukri -> company site (run #35): "Apply" opened a Google Form that requires an account, i.e. Google's own
     sign-in page. It has one box and a Next button - and was filled like an application form. -->
<main><h1>Sign in</h1><p>to continue to Google Forms</p>
<form id="idp"><label for="identifierId">Email or phone</label><input id="identifierId" name="identifier" type="email" autocomplete="username">
<button type="button" id="next">Next</button></form><a href="#">Create account</a></main>
<script>window.NEXT = 0; document.getElementById('next').onclick = () => { window.NEXT++; };</script>
</body></html>
