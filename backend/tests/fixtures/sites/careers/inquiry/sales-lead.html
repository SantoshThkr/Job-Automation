<!doctype html><html><head><meta charset="utf-8"><title>Careers - Join the team | RankLab</title></head><body>
<!-- rankraze.com (run #26): the agency's lead form ("Company Name", "READY TO GROW WITH AI") sits on its careers page.
     It was filled with the candidate's employer, phone and e-mail, sent, and recorded as applied. -->
<h1>Careers</h1><section><h2>Open positions</h2><p>Senior React Developer - Remote</p></section>
<section class="cta"><h3>Grow your business</h3>
<form id="lead">
 <label for="c">Company Name</label><input id="c" name="company" required>
 <label for="p">Phone</label><input id="p" name="phone" type="tel" required>
 <label for="e">Email</label><input id="e" name="email" type="email" required>
 <label for="t">Tell something</label><input id="t" name="about">
 <button type="submit">READY TO GROW WITH AI</button>
</form><div id="out"></div></section>
<script>
  window.SUBMITS = 0;
  document.querySelector('form').addEventListener('submit', async (e) => { e.preventDefault(); window.SUBMITS++;
    await fetch('/submit-lab/api/apply?r=ok', { method: 'POST', body: '{}' }).then(r => r.text());
    document.querySelector('button').remove(); });
</script></body></html>
