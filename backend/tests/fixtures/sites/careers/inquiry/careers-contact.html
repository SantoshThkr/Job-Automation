<!doctype html><html><head><meta charset="utf-8"><title>Careers | NauticalLab</title></head><body>
<!-- nauticalinfosolutions.com (run #26): the Careers page of a site builder; its only form is the contact widget
     (Name, Email, Message, SEND) and it answers "Thank you for your inquiry!". It was sent and recorded as applied. -->
<h1>Careers</h1><p>We are always looking for React and Angular developers. Join our team!</p>
<div class="widget"><h4>Drop us a line</h4>
<form id="lead">
 <label for="n">Name</label><input id="n" name="name" required>
 <label for="e">Email</label><input id="e" name="email" type="email" required>
 <label for="m">Message</label><textarea id="m" name="message"></textarea>
 <button type="submit">SEND</button>
</form><div id="out"></div></div>
<script>
  window.SUBMITS = 0;
  document.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); window.SUBMITS++;
    document.querySelector('form').remove();
    document.getElementById('out').innerHTML = '<p>Thank you for your inquiry! We will get back to you within 48 hours.</p>'; });
</script></body></html>
