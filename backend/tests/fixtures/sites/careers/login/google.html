<!doctype html><html><head><meta charset="utf-8"><title>Candidate sign in - Delta Systems</title></head><body>
<!-- A career site's sign-in wall that offers Google next to its own e-mail / password form.
     ?popup=1: Google's page opens in a pop-up window (as most sites do it). A session from an earlier visit
     (localStorage 'delta_session') skips the wall altogether. -->
<main><h1>Sign in to apply</h1>
<button type="button" id="google">Continue with Google</button>
<p>or use your Delta account</p>
<form id="f"><label for="u">Email address</label><input id="u" type="email" name="email">
<label for="p">Password</label><input id="p" type="password" name="password">
<button type="submit">Sign in</button></form><p id="err" class="error" hidden></p>
<p>New here? <a href="register.html">Create account</a></p></main>
<script>
if (localStorage.getItem('delta_session')) location.replace('form.html');
document.getElementById('google').addEventListener('click', () => {
  localStorage.setItem('google_clicks', String(Number(localStorage.getItem('google_clicks') || 0) + 1));
  if (/[?&]popup=1/.test(location.search)) window.open('google-idp.html?popup=1', 'google', 'width=480,height=640');
  else location.href = 'google-idp.html';
});
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault();
  localStorage.setItem('delta_signins', String(Number(localStorage.getItem('delta_signins') || 0) + 1));
  if (document.getElementById('u').value === localStorage.getItem('delta_account') &&
      document.getElementById('p').value === localStorage.getItem('delta_password')) {
    localStorage.setItem('delta_session', '1'); location.href = 'form.html'; return; }
  const err = document.getElementById('err'); err.hidden = false; err.textContent = 'Invalid email or password';
});
</script></body></html>
