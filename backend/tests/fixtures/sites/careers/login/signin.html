<!doctype html><html><head><meta charset="utf-8"><title>Candidate sign in - Gamma Systems</title></head><body>
<main><h1>Sign in to your candidate account</h1>
<form id="f"><label for="u">Email address</label><input id="u" type="email" name="email">
<label for="p">Password</label><input id="p" type="password" name="password">
<button type="submit">Sign in</button></form><p id="err" class="error" hidden></p>
<p>New here? <a href="register.html">Create account</a></p></main>
<script>
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault();
  const known = localStorage.getItem('gamma_account');
  if (known && known === document.getElementById('u').value && document.getElementById('p').value === 'Correct-Horse-1') { location.href = 'form.html'; return; }
  const err = document.getElementById('err'); err.hidden = false;
  err.textContent = known ? 'Invalid email or password' : 'No account found for this email';
});
</script></body></html>
