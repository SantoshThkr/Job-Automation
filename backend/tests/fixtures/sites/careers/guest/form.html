<!doctype html><html><head><meta charset="utf-8"><title>Application - Beta Corp</title></head><body>
<main><h1>Apply: Frontend Developer</h1>
<form action="/careers/guest/thanks.html" method="post" enctype="multipart/form-data">
<label for="n">Full name *</label><input id="n" name="name" required>
<label for="e">Email *</label><input id="e" type="email" name="email" required>
<label for="t">Mobile number *</label><input id="t" type="tel" name="mobile" required>
<label for="c">Current city *</label><input id="c" name="city" required>
<label for="r">Upload your resume *</label><input id="r" type="file" name="resume" required>
<button type="submit">Submit</button></form></main></body></html>
