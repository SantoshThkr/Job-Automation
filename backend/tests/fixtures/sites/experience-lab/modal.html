<!doctype html><html><head><meta charset="utf-8"><title>Career - MarksLab</title></head><body>
<!-- markschamp.com (run #16): a modal with unlabeled controls - the name box is type=email, two <select>s without
     labels show their first option ("Android Developer", "Fresher") although nobody chose it -->
<div class="modal show" role="dialog" aria-modal="true" id="m">
 <div class="modal-header"><img alt="" src="data:,"><button type="button" class="close"><span>&times;</span></button></div>
 <div class="modal-body">
  <div class="form-group"><span class="icon"></span><input type="email" id="exampleFormControlInput1" placeholder="Enter your name"></div>
  <div class="form-group"><span class="icon"></span><input type="number" id="exampleFormControlInput2" placeholder="Enter your phone number."></div>
  <div class="form-group"><span class="icon"></span><select id="exampleFormControlSelect1"><option>Android Developer</option>
    <option>Frontend Developer</option><option>Backend Developer</option><option>Teacher</option></select></div>
  <div class="form-group"><span class="icon"></span><select id="exampleFormControlS"><option>Fresher</option>
    <option>Intermediate</option><option>1+ Experience</option><option>5+ Experience</option></select></div>
  <div class="form-group"><label for="cn">Country</label><select id="cn"><option>Germany</option><option selected>India</option></select></div>
  <div class="form-group"><label for="src">Where did you see the opening?</label><select id="src"><option value="">Select</option>
    <option>LinkedIn</option><option>Naukri</option></select></div>
  <button type="button" id="send">SUBMIT</button>
 </div>
</div>
</body></html>
