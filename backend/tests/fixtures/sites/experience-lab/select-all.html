<!doctype html><html><head><meta charset="utf-8"><title>Screening questions</title></head><body>
<h1>Apply for Frontend Engineer</h1>
<form id="app">
 <fieldset><legend>Which of the following do you have hands-on experience with? (Select all that apply) *</legend>
  <label><input type="checkbox" name="stack" value="1"> AWS</label>
  <label><input type="checkbox" name="stack" value="2"> React</label>
  <label><input type="checkbox" name="stack" value="3"> Terraform</label>
  <label><input type="checkbox" name="stack" value="4"> TypeScript, JavaScript</label>
  <label><input type="checkbox" name="stack" value="5"> None of the above</label>
 </fieldset>
 <button type="submit">Submit application</button>
</form>
</body></html>
