<!doctype html><html><head><meta charset="utf-8"><title>Careers | TwoLab</title></head><body>
<!-- nubeera.com (run #23): two forms on one page, each with its own "Full Name" label and an example as placeholder.
     voidspaceitsolutions.com (run #23): a label whose for="..." was copy-pasted from the field above. -->
<h1>Careers</h1>
<section><h2>Apply Now</h2>
<form id="candidate">
 <div><label for="candidate-name">Full Name</label><input type="text" id="candidate-name" required placeholder="Alex Morgan"></div>
 <div><label for="candidate-email">Email Address</label><input type="email" id="candidate-email" required placeholder="alex@company.test"></div>
 <div class="form-group"><label for="candidate-name">Contact Number</label><input type="text" id="contact" name="contact" required placeholder="Enter your Contact"></div>
 <div><label for="candidate-cv">Upload Resume</label><input type="file" id="candidate-cv" required></div>
 <button type="submit">Submit application</button>
</form></section>
<section><h2>Become a trainer</h2>
<form id="trainer">
 <div><label for="trainer-name">Full Name</label><input type="text" id="trainer-name" required placeholder="Dr. Sarah Jenkins"></div>
 <div><label for="trainer-email">Email Address</label><input type="email" id="trainer-email" required placeholder="sarah@learning.test"></div>
 <button type="submit">Send</button>
</form></section>
</body></html>
