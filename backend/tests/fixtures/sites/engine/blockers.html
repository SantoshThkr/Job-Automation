<!doctype html><html><head><meta charset="utf-8"><title>Blockers</title></head><body>
<div id="captcha-box" style="display:none"><iframe title="reCAPTCHA challenge" src="about:blank" width="300" height="200"></iframe></div>
<div id="otp-box" style="display:none"><p>We have sent a code to your phone. Enter the 6-digit code.</p><input autocomplete="one-time-code" name="otp"></div>
<button onclick="document.getElementById('captcha-box').style.display='block'">captcha</button>
<button onclick="document.getElementById('otp-box').style.display='block'">otp</button>
</body></html>
